name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly run at 06:00 UTC — catches drift in target apps and dependencies
  schedule:
    - cron: '0 6 * * *'
  # Manual "Run workflow" button in the Actions tab
  workflow_dispatch:

env:
  # Repository secret (Settings → Secrets and variables → Actions).
  # API tests skip cleanly when unset.
  REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # All browsers — the CI config enables firefox/webkit/mobile projects,
      # so installing only chromium made those fail at launch in milliseconds.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run all tests (chromium only on PR)
        if: github.event_name != 'pull_request'
        run: npm test -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 14
